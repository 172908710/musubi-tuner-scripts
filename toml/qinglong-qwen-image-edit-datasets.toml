# Qwen Image Edit dataset config for the consolidated 20260708 AB concept dataset
# image_directory = target images (B, ruined output)
# control_directory = input/control images (A, clean/complete input)
# captions (.txt) are stored next to target images in image_directory
# trigger word: ql_forsaken_asset

[general]
resolution = [1280, 1280]
caption_extension = ".txt"
batch_size = 1
enable_bucket = true
bucket_no_upscale = true

[[datasets]]
image_directory = "./train/20260708/B"
control_directory = "./train/20260708/A"
cache_directory = "./train/20260708/cache_qwen_image_edit"
num_repeats = 1
no_resize_control = true  # A/B dimensions are paired; preserve original control-image geometry
